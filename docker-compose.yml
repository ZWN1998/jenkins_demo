version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"    # Jenkins Web UI
      - "50000:50000"  # Jenkins Agent 通信
      - "8787:8787"    # Spring Boot 应用端口
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
